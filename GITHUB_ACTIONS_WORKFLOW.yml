# GitHub Actions Workflow for Google Play Deployment
#
# This file is a reference for setting up automated deployment.
# Due to GitHub Personal Access Token limitations (needs 'workflow' scope),
# this file cannot be auto-pushed. Follow these steps to add it manually:
#
# 1. Create a new GitHub Personal Access Token with 'workflow' scope:
#    https://github.com/settings/tokens
#
# 2. Go to: https://github.com/inoor19/challenge-education-app
#
# 3. Click "Add file" → "Create new file"
#
# 4. Name it: .github/workflows/deploy-google-play.yml
#
# 5. Paste the content below (everything after this comment block)
#
# 6. Commit with message: "Add GitHub Actions deployment workflow"
#
# 7. After adding, deploy by running:
#    git tag v1.0.0
#    git push origin v1.0.0
#
# ============================================================================

name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.27.3'
  JAVA_VERSION: '21'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build Android App Bundle
        run: flutter build appbundle --release
        working-directory: mobile

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_KEY_JSON }}
          packageName: com.challenge_education.app
          releaseFiles: 'mobile/build/app/outputs/bundle/release/app-release.aab'
          track: internal
          status: draft
          whatsNewDirectory: mobile/whatsnew
          mappingFile: mobile/build/app/outputs/mapping/release/mapping.txt

      - name: Create Release
        uses: actions/create-release@v1
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Build successful! App uploaded to Google Play Internal Testing.

            Package: com.challenge_education.app
            Track: Internal Testing (Draft)

            Next steps:
            1. Review the app in Google Play Console
            2. Complete any missing app store details
            3. Move from Internal Testing to Production track
          draft: false
          prerelease: true

  notify-failure:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: failure()

    steps:
      - name: Build Failed Notification
        run: |
          echo "❌ Build or upload failed"
          echo "Check the action logs for details"
          exit 1
