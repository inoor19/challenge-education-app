name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build-and-deploy:
    name: Build and Deploy to Google Play
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build app bundle
        working-directory: mobile
        run: |
          flutter build appbundle --release
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Setup Python for API
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Google API client
        run: |
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Create credentials file
        run: |
          echo "${{ secrets.GOOGLE_PLAY_KEY_JSON }}" > credentials.json
          cat credentials.json | head -c 50

      - name: Upload to Google Play (Internal Testing)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import sys
          from google.oauth2.service_account import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          # Load service account credentials
          with open('credentials.json') as f:
              service_account_info = json.load(f)

          # Authenticate
          credentials = Credentials.from_service_account_info(
              service_account_info,
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )

          # Build service
          service = build('androidpublisher', 'v3', credentials=credentials)

          # Read app bundle
          with open('mobile/build/app/outputs/bundle/release/app-release.aab', 'rb') as f:
              bundle_content = f.read()

          # Upload bundle
          request = service.edits().insert(body={}, packageName='com.competitionarena.app')
          edit = request.execute()
          edit_id = edit['id']

          print(f"✓ Created edit: {edit_id}")

          # Upload bundle to edit
          bundle_request = service.edits().bundles().upload(
              editId=edit_id,
              packageName='com.competitionarena.app',
              media_body=bundle_content
          )
          bundle = bundle_request.execute()
          print(f"✓ Uploaded bundle: {bundle['versionCode']}")

          # Create release on internal testing track
          track_request = service.edits().tracks().update(
              editId=edit_id,
              packageName='com.competitionarena.app',
              track='internal',
              body={'releases': [{'name': 'v1.0.0', 'versionCodes': [str(bundle['versionCode'])]}]}
          )
          track = track_request.execute()
          print(f"✓ Released to {track['track']}")

          # Commit edit
          commit_request = service.edits().commit(
              editId=edit_id,
              packageName='com.competitionarena.app'
          )
          result = commit_request.execute()
          print(f"✓ Committed: {result['id']}")

          print("\n✓ Successfully deployed to Google Play!")
          print("  Package: com.competitionarena.app")
          print("  Track: internal testing")
          PYTHON_SCRIPT

      - name: Create Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Version: $VERSION" > release-notes.txt
          echo "Release Date: $(date)" >> release-notes.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body_path: release-notes.txt
          draft: false
          prerelease: false

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: app-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Notify on Failure
        if: failure()
        run: |
          echo "Deployment failed!"
          echo "Check the logs above for details"
          exit 1

      - name: Cleanup
        if: always()
        run: rm -f credentials.json
